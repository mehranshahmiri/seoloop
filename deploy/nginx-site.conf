# Example server block. Adjust server_name and TLS paths (e.g. via certbot).
server {
    server_name seoloop.in www.seoloop.in;
    root /var/www/seoloop-api/public;
    index index.php;
    merge_slashes off;            # keep https:// intact inside the URL path
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'" always;

    gzip on;
    gzip_types text/plain text/html application/json;

    # Everything is routed through the front controller. Audits and comparisons are the expensive ones.
    location ~ ^/(audit|compare)/ {
        limit_req zone=seoaudit burst=3 nodelay;
        limit_conn seoconn 3;
        include /etc/nginx/snippets/seoloop-fastcgi.conf;
    }
    # MCP handshakes are several quick requests, so it gets a more generous zone.
    location = /mcp {
        limit_req zone=seomcp burst=10 nodelay;
        limit_conn seoconn 3;
        client_max_body_size 64k;
        include /etc/nginx/snippets/seoloop-fastcgi.conf;
    }
    location / {
        limit_req zone=seoapi burst=15 nodelay;
        limit_conn seoconn 6;
        include /etc/nginx/snippets/seoloop-fastcgi.conf;
    }
    location ~ /\.(?!well-known) { deny all; }

    listen 443 ssl;
    # ssl_certificate / ssl_certificate_key ...
}
