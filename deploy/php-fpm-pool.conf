; Dedicated pool so a flood of audit requests can't starve other sites on the box.
[seoloop-api]
user = www-data
group = www-data
listen = /run/php/seoloop-api.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500
request_terminate_timeout = 35s
php_admin_value[open_basedir] = /var/www/seoloop-api:/var/cache/seoloop-api:/etc/ssl/certs:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,mail
php_admin_value[max_execution_time] = 30
php_admin_value[memory_limit] = 64M
php_admin_flag[expose_php] = off
