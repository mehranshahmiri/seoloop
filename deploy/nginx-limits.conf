# Put in /etc/nginx/conf.d/ (http context).
limit_req_zone  $binary_remote_addr zone=seoapi:10m   rate=30r/m;
limit_req_zone  $binary_remote_addr zone=seoaudit:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=seomcp:10m   rate=20r/m;
limit_conn_zone $binary_remote_addr zone=seoconn:10m;
limit_req_status 429;
limit_conn_status 429;
